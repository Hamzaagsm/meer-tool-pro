# MEER TOOL PRO — Windows EXE build (PyInstaller, single-file)
#
# Kab chalta hai:
#   - main par har push par (Actions tab se artifact download hota hai)
#   - v* tag push par (masalan v1.0) — artifact ke saath GitHub Release
#     par bhi EXE + ZIP lag jate hain
#   - Actions tab se "Run workflow" (workflow_dispatch) se bhi
#
# Khaas faislay:
#   - tools/ folder ko EXE ke ANDAR bundle NAHI kiya gaya (--add-data nahi
#     lagaya): onefile EXE temp folder me khulta hai jo har run par mit
#     jata hai — user ke apne loaders (tools/loaders/qualcomm/) aur
#     platform-tools wahan kabhi tik hi nahi sakte thay. Is liye tools/
#     EXE ke SAATH alag folder ki surat me ZIP me jata hai, aur app
#     (src/core/runner.py, frozen-aware APP_ROOT) use EXE ke barabar
#     wale folder me dhoondhta hai.
#   - src/ops/*.py plugins pkgutil se runtime par discover hote hain —
#     PyInstaller ki static analysis unhe nahi dekh sakti, is liye har
#     ops module --hidden-import se pakka shamil hai. Naya op jorna ho
#     to yahan aik --hidden-import line bhi jorna hogi.
name: Build MEERToolPro EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # tag builds par Release banane ke liye

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller + requirements
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6"
          pip install -r requirements.txt

      - name: Build single-file windowed EXE
        run: >
          pyinstaller --noconfirm --clean
          --onefile --windowed
          --name MEERToolPro
          --paths src
          --hidden-import demo
          --hidden-import ops.adb_info
          --hidden-import ops.adb_mdm_bypass
          --hidden-import ops.adb_reboot
          --hidden-import ops.adb_reboot_bootloader
          --hidden-import ops.adb_reboot_recovery
          --hidden-import ops.demo_session
          --hidden-import ops.fastboot_info
          --hidden-import ops.fastboot_frp
          --hidden-import ops.fastboot_reset
          --hidden-import ops.fastboot_reboot
          --hidden-import ops.mdm_adb_check
          --hidden-import ops.mdm_app_profiles
          --hidden-import ops.mdm_finance_check
          --hidden-import ops.mdm_library
          --hidden-import ops.mdm_meta_guide
          --hidden-import ops.mdm_payjoy
          --hidden-import ops.mdm_proinfo_backup
          --hidden-import ops.mdm_proinfo_write
          --hidden-import ops.mdm_security_plugin
          --hidden-import ops.mtk_backup
          --hidden-import ops.mtk_bl_lock
          --hidden-import ops.mtk_bl_unlock
          --hidden-import ops.mtk_bypass_chain
          --hidden-import ops.mtk_flash
          --hidden-import ops.mtk_frp_reset
          --hidden-import ops.mtk_identify_backup
          --hidden-import ops.mtk_info
          --hidden-import ops.mtk_meta_imei_restore
          --hidden-import ops.mtk_nv_backup
          --hidden-import ops.mtk_nv_restore
          --hidden-import ops.mtk_scatter_creator
          --hidden-import ops.mtk_sn_writer
          --hidden-import ops.qc_edl_backup
          --hidden-import ops.qc_edl_flash
          --hidden-import ops.qc_edl_frp
          --hidden-import ops.qc_edl_info
          --hidden-import ops.qc_edl_reset
          --hidden-import ops.qc_efs_backup
          --hidden-import ops.qc_efs_restore
          --hidden-import ops.qc_loader_library
          --hidden-import ops.qc_qcn_backup
          --hidden-import ops.qc_qcn_restore
          --hidden-import ops.samsung_firmware_info
          --hidden-import ops.samsung_kg_status
          --hidden-import ops.samsung_frp_router
          --hidden-import ops.spd_cert_backup
          --hidden-import ops.spd_cert_restore
          --hidden-import ops.spd_frp
          --hidden-import ops.spd_frp_pac_guide
          --hidden-import ops.spd_launcher
          --hidden-import ops.spd_pac_builder
          --hidden-import ops.spd_reset
          --hidden-import ops.spd_switch_diag
          --hidden-import ops.stubs
          --hidden-import serial.tools.list_ports
          --hidden-import ops.adb_reboot_download
          --hidden-import ops.adb_reboot_edl
          --hidden-import ops.fastboot_flash
          --hidden-import ops.fastboot_reboot_edl
          --hidden-import ops.fastboot_slot
          --hidden-import ops.fw_archive_extract
          --hidden-import ops.fw_ofp_extract
          --hidden-import ops.fw_payload_extract
          --hidden-import ops.meta_enable_adb
          --hidden-import ops.meta_enter
          --hidden-import ops.meta_enter_adb
          --hidden-import ops.meta_factory_reset
          --hidden-import ops.meta_read_info
          --hidden-import ops.moto_fastboot_frp
          --hidden-import ops.mtk_frp_only
          --hidden-import ops.mtk_nv_format
          --hidden-import ops.mtk_reset_only
          --hidden-import ops.mtk_restore_backup
          --hidden-import ops.samsung_flash
          --hidden-import ops.samsung_flash_keepdata
          --hidden-import ops.spd_readback
          --hidden-import ops.util_dump_analyser
          --hidden-import ops.util_install_drivers
          --hidden-import ops.util_update_check
          --hidden-import ops.xiaomi_miassistant
          --hidden-import ops.mtk_rpmb_read
          --hidden-import ops.mtk_rpmb_write
          --hidden-import ops.mtk_rpmb_erase
          --hidden-import ops.qc_sector_read
          --hidden-import ops.qc_sector_write
          --hidden-import ops.qc_diag_enable
          --hidden-import ops.adb_remove_ads
          --hidden-import ops.adb_restore_ads
          --hidden-import ops.adb_service_menus
          --hidden-import ops.adb_private_dns
          --hidden-import ops.adb_fix_install
          --hidden-import ops.meta_frp_erase
          --hidden-import ops.meta_ubl_unlock
          --hidden-import ops.meta_ubl_restore
          --hidden-import ops.meta_plugin_patch
          --hidden-import ops.meta_restore_patch
          --hidden-import ops.meta_gpt_read
          --hidden-import ops.meta_disable_adb
          --hidden-import ops.meta_reboot_normal
          --hidden-import ops.meta_poweroff
          --hidden-import ops.meta_reboot_fastboot
          --hidden-import ops.util_loader_import
          --hidden-import ops.fw_loader_harvest
          --hidden-import ops.util_repair_intel
          --hidden-import ops.util_transsion_rom_patcher
          --hidden-import core.loader_library
          --hidden-import core.firmware_catalog
          --hidden-import core.fw_harvest
          --hidden-import core.repair_intel
          --hidden-import core.server
          --hidden-import core.shop_sync
          --hidden-import ops.util_server_status
          --hidden-import core.mtk_serial_fallback
          --hidden-import serial
          --hidden-import serial.tools.list_ports
          --hidden-import serial.tools.list_ports_windows
          --hidden-import serial.serialwin32
          --hidden-import serial.win32
          --hidden-import serial.serialutil
          --hidden-import ops.carrier_unlock_guide
          --hidden-import ops.engine_refresh
          --hidden-import ops.meta_bootloader_unlock
          --hidden-import ops.meta_patch_capture
          --hidden-import ops.mtk_route_ladder
          --hidden-import ops.oneplus_arb_warning
          --hidden-import ops.qc_diag_qcn
          --hidden-import ops.qc_noauth_loader_slot
          --hidden-import ops.samsung_fw_download
          --hidden-import ops.spd_diag_factory_reset
          --hidden-import ops.spd_diag_frp_erase
          --hidden-import ops.xiaomi_hyperos_unlock_helper
          --hidden-import ops.xiaomi_noauth_edl
          --hidden-import core.engine_refresh
          --hidden-import core.meta_patch_capture
          --hidden-import core.mtk_ladder
          --hidden-import core.qc_diag
          --hidden-import core.samloader_client
          src/main.py

      - name: Package (EXE + tools folder aik ZIP me)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/MEERToolPro.exe pkg/
          Copy-Item tools pkg/tools -Recurse
          if (Test-Path engines) { Copy-Item engines pkg/engines -Recurse } else { New-Item -ItemType Directory -Force -Path pkg/engines | Out-Null; "Engines is package me NAHI hain — wo alag ENGINES package me milte hain. Us package ko isi folder me extract karen taake engines folder MEERToolPro.exe ke barabar me aa jaye." | Out-File -Encoding utf8 pkg/engines/ENGINES-YAHAN-EXTRACT-KAREN.txt }
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath MEERToolPro-Windows.zip -Force
          Get-ChildItem dist, MEERToolPro-Windows.zip

      - name: Upload artifact (EXE + ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: MEERToolPro-Windows
          path: |
            dist/MEERToolPro.exe
            MEERToolPro-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release (sirf tag builds par)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MEERToolPro.exe
            MEERToolPro-Windows.zip
